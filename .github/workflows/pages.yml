name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # リンクのタイトル取得用エンドポイント（worker/ を参照）。公開URLなので秘密情報ではない。
  LINK_METADATA_ENDPOINT: https://hitosaji-link-metadata.esystimsesys.workers.dev/

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
        env:
          VITE_LINK_METADATA_ENDPOINT: ${{ env.LINK_METADATA_ENDPOINT }}
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          VITE_LINK_METADATA_ENDPOINT: ${{ env.LINK_METADATA_ENDPOINT }}
      # 失敗したテストのトレースと画面を残し、CIでしか起きない失敗を調べられるようにする。
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 14
      - name: Build for repository path
        run: npm run build
        env:
          BASE_PATH: /recipe-box/
          VITE_LINK_METADATA_ENDPOINT: ${{ env.LINK_METADATA_ENDPOINT }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
